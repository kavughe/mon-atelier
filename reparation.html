            </option>

                En réparation

            </option>

                Livré

</label>

<input

>


<label for="reste">

</label>

<input

>

                        <th>

                    </tr>

                </thead>

</main>



<!-- =================================
     PROTECTION DE LA PAGE
================================= -->

<script>

    const acces =
        sessionStorage.getItem(
            "accesReparation"
        );


    if (acces !== "autorise") {

        window.location.href =
            "connexion.html";

    }

</script>



<!-- =================================
     JAVASCRIPT PRINCIPAL
================================= -->

<script src="script.js"></script>



<!-- =================================
     AFFICHAGE DU RÔLE
================================= -->

<script>

    const role =
        sessionStorage.getItem("role");


    const utilisateurConnecte =
        document.getElementById(
            "utilisateurConnecte"
        );


    if (role === "admin") {

        utilisateurConnecte.textContent =
            "👨‍💼 Administrateur";

    }


    else if (role === "reception") {

        utilisateurConnecte.textContent =
            "👤 Réceptionniste";

    }


    else if (role === "consultation") {

        utilisateurConnecte.textContent =
            "👁️ Consultation";

    }


</script>



<!-- =================================
     GESTION DES DROITS
================================= -->

<script>

    const boutonEnregistrer =
        document.getElementById(
            "btnEnregistrer"
        );


    const boutonModifier =
        document.getElementById(
            "btnModifier"
        );


    const boutonEffacer =
        document.getElementById(
            "btnEffacer"
        );


    const boutonNouveau =
        document.getElementById(
            "btnNouveau"
        );



    /*
       CONSULTATION
       -------------------------
       Peut seulement voir
       et rechercher.
    */

    if (role === "consultation") {

        if (boutonEnregistrer) {
            boutonEnregistrer.remove();
        }

        if (boutonModifier) {
            boutonModifier.remove();
        }

        if (boutonEffacer) {
            boutonEffacer.remove();
        }

        if (boutonNouveau) {
            boutonNouveau.remove();
        }

    }



    /*
       RECEPTION
       -------------------------
       Peut ajouter.
       Ne peut pas modifier
       ni effacer.
    */

    if (role === "reception") {

        if (boutonModifier) {
            boutonModifier.remove();
        }

        if (boutonEffacer) {
            boutonEffacer.remove();
        }

    }

</script>



<!-- =================================
     DÉCONNEXION
================================= -->

<script src="deconnexion.js"></script>

<script src="script.js"></script>

<script>
    const btnDeconnexion =
        document.getElementById("btnDeconnexion");

    if (btnDeconnexion) {

        btnDeconnexion.addEventListener("click", function () {

            sessionStorage.removeItem("accesReparation");
            sessionStorage.removeItem("role");

            window.location.href = "connexion.html";

        });

    }
</script>
</body>

</html>
