<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mon Atelier - Ajouter un matériel</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #222;
        }

        .container {
            max-width: 850px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 20px;
        }

        .header h1 {
            font-size: 25px;
            color: #1f2937;
        }

        .header p {
            margin-top: 6px;
            color: #6b7280;
            font-size: 14px;
        }

        .back-btn {
            text-decoration: none;
            background: #6b7280;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
        }

        .back-btn:hover {
            background: #4b5563;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #374151;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .required {
            color: #dc2626;
        }

        .price-row {
            display: grid;
            grid-template-columns: 1fr 220px;
            gap: 15px;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }

        .btn {
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .btn-cancel {
            background: #e5e7eb;
            color: #374151;
        }

        .btn-cancel:hover {
            background: #d1d5db;
        }

        .btn-save {
            background: #2563eb;
            color: white;
        }

        .btn-save:hover {
            background: #1d4ed8;
        }

        .flash {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            background: #fee2e2;
            color: #991b1b;
        }

        @media (max-width: 700px) {

            .container {
                margin: 15px auto;
                padding: 10px;
            }

            .card {
                padding: 20px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .price-row {
                grid-template-columns: 1fr;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                text-align: center;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="header">

            <div>
                <h1>📦 Ajouter un matériel</h1>
                <p>Ajouter un matériel électrique ou électronique au catalogue</p>
            </div>

            <a href="{{ url_for('materiels') }}" class="back-btn">
                ← Retour
            </a>

        </div>


        <!-- Messages Flask -->

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="flash">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <form method="POST">


            <!-- Désignation -->

            <div class="form-group">

                <label for="designation">
                    Désignation <span class="required">*</span>
                </label>

                <input
                    type="text"
                    id="designation"
                    name="designation"
                    placeholder="Exemple : Câble électrique 2.5 mm²"
                    required
                    autofocus
                >

            </div>


            <!-- Catégorie et unité -->

            <div class="form-row">

                <div class="form-group">

                    <label for="categorie">
                        Catégorie
                    </label>

                    <select id="categorie" name="categorie">

                        <option value="">
                            -- Choisir une catégorie --
                        </option>

                        <option value="Électricité">
                            ⚡ Électricité
                        </option>

                        <option value="Électronique">
                            🔌 Électronique
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="unite">
                        Unité
                    </label>

                    <select id="unite" name="unite">

                        <option value="">
                            -- Choisir une unité --
                        </option>

                        <option value="Pièce">
                            Pièce
                        </option>

                        <option value="Mètre">
                            Mètre
                        </option>

                        <option value="Rouleau">
                            Rouleau
                        </option>

                        <option value="Boîte">
                            Boîte
                        </option>

                        <option value="Paquet">
                            Paquet
                        </option>

                        <option value="Lot">
                            Lot
                        </option>

                    </select>

                </div>

            </div>


            <!-- Prix et devise -->

            <div class="form-group">

                <label>
                    Prix unitaire
                </label>

                <div class="price-row">

                    <input
                        type="number"
                        id="prix"
                        name="prix"
                        min="0"
                        step="0.01"
                        placeholder="Exemple : 1500"
                        value="0"
                    >


                    <select id="devise" name="devise">

                        <option value="FC">
                            🇨🇩 Franc congolais (FC)
                        </option>

                        <option value="USD">
                            🇺🇸 Dollar américain (USD)
                        </option>

                    </select>

                </div>

            </div>


            <!-- Description -->

            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    placeholder="Exemple : câble cuivre souple, 3 conducteurs..."
                ></textarea>

            </div>


            <!-- Boutons -->

            <div class="actions">

                <a
                    href="{{ url_for('materiels') }}"
                    class="btn btn-cancel"
                >
                    Annuler
                </a>

                <button
                    type="submit"
                    class="btn btn-save"
                >
                    💾 Enregistrer le matériel
                </button>

            </div>

        </form>

    </div>

</div>

</body>

</html>
