<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Connexion - Mon Atelier</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="login-page">

    <div class="login-container">

        <div class="login-logo">
            🔧
        </div>

        <h1>Mon Atelier</h1>

        <p class="login-subtitle">
            Connectez-vous à votre espace
        </p>


        <form id="formConnexion">

            <div class="form-group">

                <label for="nomUtilisateur">
                    👤 Nom d'utilisateur
                </label>

                <input
                    type="text"
                    id="nomUtilisateur"
                    placeholder="Votre nom d'utilisateur"
                    required>

            </div>


            <div class="form-group">

                <label for="motDePasse">
                    🔑 Mot de passe
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="motDePasse"
                        placeholder="Votre mot de passe"
                        required>

                    <button
                        type="button"
                        id="voirMotDePasse">
                        👁️
                    </button>

                </div>

            </div>


            <p
                id="messageConnexion"
                class="message-connexion">
            </p>


            <button
                type="submit"
                class="btn-connexion">

                🔐 Se connecter

            </button>

        </form>


        <div class="login-footer">

            <p>
                Mon Atelier
            </p>

            <small>
                Gestion professionnelle d'atelier
            </small>

        </div>

    </div>


    <script src="connexion.js"></script>

</body>

</html>
